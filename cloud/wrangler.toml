# Cloudflare Workers: игра (статические файлы) + онлайн-ретранслятор комнат (cloud/worker.js).
# Развернуть: deploy.bat (или из корня проекта: npx wrangler deploy --config cloud/wrangler.toml).
# Бесплатного тарифа хватает; адрес будет https://project-commando.<ваш-поддомен>.workers.dev
name = "project-commando"
main = "worker.js"
compatibility_date = "2025-09-01"

# файлы игры — корень проекта (лишнее исключено в .assetsignore)
[assets]
directory = ".."
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
