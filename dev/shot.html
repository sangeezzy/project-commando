<!doctype html>
<html><head><meta charset="utf-8"><title>shot</title>
<style>html,body{margin:0;overflow:hidden;background:#000}iframe{border:0;width:100vw;height:100vh;display:block}</style></head>
<body>
<!-- Скриншот сцены: ?q=параметры_игры&n=кадров&js=код_подготовки (выполняется в игре до прогона кадров).
     Запуск: chrome --headless=new --screenshot --window-size=1280,720 ".../dev/shot.html?..." -->
<iframe id="f"></iframe>
<script>
const q = new URLSearchParams(location.search);
const f = document.getElementById('f');
f.src = new URL('../game/index.html?autotest=1&' + (q.get('q') || ''), location.href).href;
f.onload = () => {
  const w = f.contentWindow;
  w.__manualTick = true;      // кадры двигает только этот скрипт
  setTimeout(() => {
    try {
      w.eval('resize()');
      if (q.get('js')) w.eval(q.get('js'));
      const n = +(q.get('n') || 120);
      w.eval(`for (let i = 0; i < ${n}; i++) { G.time += 1/60; update(1/60); } render(1/60);`);
      if (q.get('js2')) { w.eval(q.get('js2')); w.eval('render(1/60)'); }
      // держим кадр на экране: перерисовываем готовую сцену (фоновый цикл игры при __manualTick стоит)
      const keep = () => { w.eval('render(0)'); w.requestAnimationFrame(keep); };
      keep();
    } catch (e) { document.title = 'ERR ' + e; document.body.insertAdjacentHTML('beforeend', '<pre style="color:#f55;position:fixed;top:0">' + e + '\n' + e.stack + '</pre>'); }
  }, 300);
};
</script>
</body></html>
