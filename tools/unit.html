<!doctype html>
<html><head><meta charset="utf-8"><title>unit</title></head>
<body>
<!-- Юнит-тест: ?test=имя&q=параметры_игры. Игра грузится в iframe (../index.html?autotest=1&...),
     затем внедряется tools/tests/имя.js. Тест пишет в window.__result массив {name, ok, got}
     (или промис с таким массивом). Ошибки консоли игры тоже попадают в результат. -->
<iframe id="f" style="width:1000px;height:640px;border:0"></iframe>
<pre id="out">WAIT</pre>
<script>
const q = new URLSearchParams(location.search);
const name = q.get('test');
const f = document.getElementById('f');
const out = document.getElementById('out');
const finish = (res) => { out.textContent = 'RESULT ' + JSON.stringify(res); };
f.src = new URL('../index.html?autotest=1&' + (q.get('q') || ''), location.href).href;
f.onload = () => {
  const w = f.contentWindow;
  try {
    // скрипты игры не загрузились (синтаксическая ошибка) — нет главных функций
    const missing = ['startRange', 'updateWorld', 'render', 'drawHUD', 'updateAI', 'applySnapshot'].filter((fn) => w.eval('typeof ' + fn) !== 'function');
    if (missing.length) { finish([{ name: 'скрипты игры загружены', ok: false, got: missing }]); return; }
    w.__manualTick = true;      // фоновый игровой цикл стоит: симуляцию двигает тест
    w.__errors = [];
    w.addEventListener('error', (e) => w.__errors.push(String(e.message) + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno));
    // общие помощники тестов, затем сам тест
    const lib = w.document.createElement('script');
    lib.src = new URL('tests/_lib.js', location.href).href;
    const s = w.document.createElement('script');
    s.src = new URL('tests/' + name + '.js', location.href).href;
    lib.onload = () => w.document.body.appendChild(s);
    s.onload = async () => {
      try {
        let res = await w.__result;
        res = res || [{ name: 'тест вернул результат', ok: false }];
        res.push({ name: 'без ошибок в консоли', ok: !w.__errors.length, got: w.__errors.slice(0, 5) });
        finish(res);
      } catch (e) { finish([{ name: 'тест', ok: false, got: String(e) + ' ' + (e.stack || '') }]); }
    };
    s.onerror = () => finish([{ name: 'load ' + name, ok: false, got: 'script not found' }]);
    w.document.body.appendChild(lib);
  } catch (e) {
    finish([{ name: 'harness', ok: false, got: String(e) + ' ' + (e.stack || '') }]);
  }
};
</script>
</body></html>
