<!doctype html>
<html><head><meta charset="utf-8"><title>net</title></head>
<body>
<!-- Сетевой тест: хост и два гостя в трёх фреймах (плюс третий гость позже входит в идущую игру).
     Лобби, уникальность персонажей, старт, синхронизация мира, совместный завал по сети, спидер под управлением гостя,
     голосовые звонки (фейковый микрофон), вход на место бота и выход.
     Нужен http-сервер (run_tests.py --net) и интернет (сигнальный сервер PeerJS). Отчёт уходит POST-запросом на /report. -->
<style>iframe{width:600px;height:380px;border:0}</style>
<iframe id="h"></iframe><iframe id="g1"></iframe><iframe id="g2"></iframe><iframe id="g3"></iframe>
<script>
const frames = ['h', 'g1', 'g2', 'g3'].map((id) => document.getElementById(id));
const [H, G1, G2, G3] = frames;
const log = [], checks = [];
const check = (name, ok, got) => checks.push({ name, ok: !!ok, got });
const W = (f) => f.contentWindow;
const E = (f, code) => W(f).eval(code);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (fn, ms, step = 200) => { const t0 = Date.now(); while (Date.now() - t0 < ms) { try { if (fn()) return true; } catch (e) { /* ещё рано */ } await sleep(step); } return false; };
const post = (final) => fetch('/report', { method: 'POST', body: JSON.stringify({ final, log, checks }) }).catch(() => {});

function load(f) {
  return new Promise((res) => {
    f.onload = () => {
      // симуляция идёт по таймеру: в headless requestAnimationFrame нерегулярен
      E(f, `window.__manualTick = true; window.__errors = [];
        addEventListener('error', (e) => __errors.push(String(e.message) + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno));
        setInterval(() => { if (G.role !== 'none' && map && G.state !== 'lobby') { G.time += 1 / 60; update(1 / 60); } Voice.update(); }, 16);`);
      res();
    };
    f.src = new URL('../index.html', location.href).href;
  });
}

async function main() {
  await Promise.all(frames.map(load));
  log.push('загружено');
  // голос: фейковый микрофон Chrome
  for (const f of [H, G1, G2]) await E(f, 'Voice.enable()');
  E(H, "document.getElementById('name').value = 'Хост'; document.getElementById('btnHost').click()");
  if (!await until(() => E(H, 'Net.code'), 15000)) { check('комната создана', false); return post(true); }
  const code = E(H, 'Net.code');
  log.push('код ' + code);
  E(G1, "document.getElementById('name').value = 'Первый'; readName(); joinGame('" + code + "')");
  await until(() => E(G1, 'Net.connected'), 15000);
  E(G2, "document.getElementById('name').value = 'Второй'; readName(); joinGame('" + code + "')");
  const joined = await until(() => E(H, 'Lobby.slots.filter((s) => s.human).length') === 3, 20000);
  check('два гостя вошли в лобби', joined, E(H, 'Lobby.slots.map((s) => s.name)'));
  check('гости видят лобби', E(G1, "G.state") === 'lobby' && E(G2, "G.state") === 'lobby');

  // выбор персонажей: оба гостя хотят Б, достанется одному
  E(H, 'pickChar(0, 0)');
  E(G1, "send({ t: 'pick', ch: 1 })");
  await sleep(400);
  E(G2, "send({ t: 'pick', ch: 1 })");
  await sleep(600);
  check('персонаж Б достался одному гостю', E(H, 'Lobby.slots[1].ch') === 1 && E(H, 'Lobby.slots[2].ch') === -1, E(H, 'Lobby.slots.map((s) => s.ch)'));
  E(G2, "send({ t: 'pick', ch: 2 })");
  await sleep(500);
  check('у гостя в лобби виден чужой выбор', E(G2, 'Lobby.slots[1].ch') === 1 && E(G2, 'Lobby.slots[2].ch') === 2);
  E(H, 'startGameFromLobby()');
  await sleep(300);
  check('пока гости не готовы — старт не идёт', E(H, 'G.state') === 'lobby');
  E(G1, "send({ t: 'ready', v: true })"); E(G2, "send({ t: 'ready', v: true })");
  await until(() => E(H, 'Lobby.slots[1].ready && Lobby.slots[2].ready'), 5000);
  E(H, 'startGameFromLobby()');
  const started = await until(() => E(G1, 'G.state') === 'play' && E(G1, 'map && map.hub') && E(G2, 'map && map.hub'), 10000);
  check('игра началась у всех (база)', started);
  check('у гостей 4 героя, один из них бот', E(G1, 'G.players.length') === 4 && E(G1, 'G.players.filter((p) => p.bot).length') === 1);

  // голос: у каждого два удалённых потока
  const voiceOk = await until(() => [H, G1, G2].every((f) => E(f, 'Voice.remotes.size') === 2), 20000, 500);
  check('голосовой чат: каждый слышит двоих', voiceOk, [H, G1, G2].map((f) => E(f, 'Voice.remotes.size')));

  // миссия: сразу пещеры, без брифинга
  E(H, 'startMission(1); G.brief = null');
  await until(() => E(G1, 'G.stage') === 1 && E(G2, 'G.stage') === 1, 8000);
  E(G1, 'G.brief = null'); E(G2, 'G.brief = null');
  await sleep(1000);
  check('гости на том же этапе', E(G1, 'G.lv') === 1 && E(G1, 'G.stage') === 1 && E(G2, 'G.stage') === 1);
  check('враги совпадают', E(G1, 'G.enemies.length') === E(H, 'G.enemies.length'), [E(H, 'G.enemies.length'), E(G1, 'G.enemies.length')]);

  // гость идёт — хост видит
  const g1idx = E(G1, 'G.myIdx');
  const x0 = E(H, `pById(${g1idx}).x`);
  E(G1, 'keys.KeyW = true');
  await sleep(1200);
  E(G1, 'keys.KeyW = false');
  await sleep(400);
  const moved = Math.hypot(E(H, `pById(${g1idx}).x`) - E(G1, 'me().x'), E(H, `pById(${g1idx}).y`) - E(G1, 'me().y'));
  check('хост видит, где гость', moved < 20, { diff: Math.round(moved) });
  // выстрел гостя
  E(H, 'G.bullets = []');
  E(G1, 'me().atkCd = 0; tryFire(me())');
  const shot = await until(() => E(H, `G.bullets.some((b) => b.o === ${g1idx})`) || E(H, `G.bullets.length`) > 0, 2000, 50);
  check('выстрел гостя появился у хоста', shot);

  // завал по сети: хост и второй гость в одной пещере (персонажи А и В? — А с Б, а Б у первого гостя)
  // Отряд 1: А (хост) + Б (первый гость). Ставим обоих к завалу w1.
  E(H, `{ const o = objByName('w1'); for (const p of G.players) if (CHARS[p.ch].squad === 0) { const s = freeSpotNear(o.x + (p.idx ? 25 : -25), o.y + 95); p.x = p.rx = s.x; p.y = p.ry = s.y; p.tp++; }
         for (const e of G.enemies) e.dead = true; }`);
  await sleep(600);
  const wid = E(H, "objByName('w1').id");
  E(H, `debrisPress(objById(${wid}), me(), 0)`);
  E(G1, `act(me(), { k: 'dg', id: ${wid}, ph: 0 })`);
  await until(() => E(G1, `objById(${wid}).eng.length`) >= 2, 3000);
  // оба жмут в зелёной зоне по своим часам
  const hostLoop = setInterval(() => { try { E(H, `{ const o = objById(${wid}); const ph = debrisPhase(o); if (!o.done && o.eng.length >= 2 && ph > 0.66 && ph < 0.78 && !o.hits.includes(G.myIdx)) debrisPress(o, me(), ph); }`); } catch (e) {} }, 30);
  const g1Loop = setInterval(() => { try { E(G1, `{ const o = objById(${wid}); const ph = debrisPhase(o); if (!o.done && o.eng.length >= 2 && ph > 0.68 && ph < 0.76 && window.__last !== Math.floor(G.time / DG_ROUND * 3)) { window.__last = Math.floor(G.time / DG_ROUND * 3); act(me(), { k: 'dg', id: o.id, ph: r2(ph) }); } }`); } catch (e) {} }, 30);
  const cleared = await until(() => E(H, `objById(${wid}).done`), 25000, 300);
  clearInterval(hostLoop); clearInterval(g1Loop);
  check('завал разобран вдвоём по сети', cleared, E(H, `objById(${wid}).prog`));
  await sleep(500);
  check('у гостя завал тоже разобран (проход открыт)', E(G1, `objById(${wid}).done && tileAt(objById(${wid}).tiles[0][0], objById(${wid}).tiles[0][1]) === T.FLOOR`));

  // спидер: этап 2, гость за рулём
  E(H, "G.m = freshFlags(); startStage(1, 2, 'start')");
  await until(() => E(G2, 'G.stage') === 2 && E(G2, 'me() && me().ride') >= 0, 6000);
  await sleep(500);
  const g2idx = E(G2, 'G.myIdx');
  const drv = E(H, `G.speeders.find((s) => s.seats[0] === ${g2idx}) ? 1 : 0`);
  check('гость (отряд 2, человек) за рулём своего спидера', drv === 1, E(H, 'G.speeders.map((s) => s.seats)'));
  const sx0 = E(H, `G.speeders.find((s) => s.seats[0] === ${g2idx}).x`);
  E(G2, 'keys.KeyD = true');
  await sleep(1500);
  E(G2, 'keys.KeyD = false');
  await sleep(400);
  const sx1 = E(H, `G.speeders.find((s) => s.seats[0] === ${g2idx}).x`);
  check('гость ведёт спидер — хост видит движение', sx1 - sx0 > 150, Math.round(sx1 - sx0));
  E(G2, "act(me(), { k: 'ride' })");
  await until(() => E(G2, 'me().ride') === -1, 3000);
  await sleep(500);
  const dd = Math.hypot(E(H, `pById(${g2idx}).x`) - E(G2, 'me().x'), E(H, `pById(${g2idx}).y`) - E(G2, 'me().y'));
  check('гость сошёл: позиция совпадает у хоста и гостя', E(H, `pById(${g2idx}).ride`) === -1 && dd < 24, Math.round(dd));

  // третий гость входит в идущую игру на место бота
  E(G3, "document.getElementById('name').value = 'Опоздавший'; readName(); joinGame('" + code + "')");
  const late = await until(() => E(G3, 'G.state') === 'play' && E(G3, 'G.stage') === 2 && E(G3, 'me()'), 15000);
  const lateIdx = late ? E(G3, 'G.myIdx') : -1;
  check('опоздавший вошёл в игру на место бота', late && E(H, `pById(${lateIdx}).bot`) === false && E(H, `pById(${lateIdx}).name`) === 'Опоздавший');
  E(G3, "leaveToMenu('')");
  const back = await until(() => E(H, `pById(${lateIdx}).bot`) === true, 8000);
  check('вышел — его место снова занял бот', back);

  const errs = frames.flatMap((f, i) => E(f, '__errors').map((e) => ['H', 'G1', 'G2', 'G3'][i] + ': ' + e));
  check('без ошибок в консоли', !errs.length, errs.slice(0, 6));
  post(true);
}
main().catch((e) => { check('сценарий', false, String(e) + ' ' + e.stack); post(true); });
setInterval(() => post(false), 3000);
</script>
</body></html>
