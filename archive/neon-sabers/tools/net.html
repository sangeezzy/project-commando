<!doctype html>
<html><head><meta charset="utf-8"><title>net</title></head>
<body>
<!-- Сетевой тест: хост (джедай) и гость (джедай) в двух фреймах, боты играют, затем проверка синхронизации меча.
     Нужен http-сервер (run_tests.py --net) и интернет (сигнальный сервер PeerJS). Отчёт уходит POST-запросом на /report. -->
<iframe id="h" style="width:800px;height:500px;border:0"></iframe>
<iframe id="g" style="width:800px;height:500px;border:0"></iframe>
<script>
const PLAY_MS = 20000;
const H = document.getElementById('h'), Gf = document.getElementById('g');
const log = [], sab = [];
H.src = Gf.src = new URL('../index.html', location.href).href;

const post = (final) => {
  const hw = H.contentWindow, gw = Gf.contentWindow;
  let body;
  try {
    body = { final, log, sab, host: JSON.parse(hw.report()), guest: JSON.parse(gw.report()),
      guestStatus: gw.document.getElementById('status').textContent };
  } catch (e) { body = { final, log, error: String(e) }; }
  fetch('/report', { method: 'POST', body: JSON.stringify(body) });
};

function inject(f) {
  const s = f.contentWindow.document.createElement('script');
  s.src = new URL('bot.js', location.href).href;
  f.contentWindow.document.body.appendChild(s);
}

// состояние мечей с обеих сторон: [гость у себя, гость у хоста, хост у себя, хост у гостя]
function sabState() {
  const hw = H.contentWindow, gw = Gf.contentWindow;
  return [gw.eval('me().saberOn'), hw.eval('G.players.find(p => p.idx === 1).saberOn'),
          hw.eval('me().saberOn'), gw.eval('G.players.find(p => p.idx === 0).saberOn')];
}

function saberSequence() {
  const hw = H.contentWindow, gw = Gf.contentWindow;
  for (const w of [hw, gw]) { w.__botOff = true; w.eval('mouse.l = false; for (const k in keys) keys[k] = false;'); }
  hw.eval('for (const e of G.enemies) e.dead = true; G.bullets = []; for (const p of G.players) p.dead = false; G.state = "play";');
  setTimeout(() => { sab.push(['старт', sabState()]); gw.eval('saberKeyPressed = true'); }, 500);
  setTimeout(() => { sab.push(['гость нажал F', sabState()]); hw.eval('saberKeyPressed = true'); }, 2000);
  setTimeout(() => { sab.push(['хост нажал F', sabState()]); gw.eval('saberKeyPressed = true'); hw.eval('saberKeyPressed = true'); }, 3500);
  setTimeout(() => { sab.push(['оба снова F', sabState()]); post(true); }, 5000);
}

let loaded = 0;
function go() {
  if (++loaded < 2) return;
  const hw = H.contentWindow, gw = Gf.contentWindow;
  inject(H); inject(Gf);
  hw.eval("G.cls = 'jedi'");
  hw.document.getElementById('btnHost').click();
  const iv = setInterval(() => {
    const code = hw.eval('Net.code');
    if (!code) return;
    clearInterval(iv);
    log.push('code ' + code);
    gw.eval("G.cls = 'jedi'");
    gw.eval("joinGame('" + code + "')");
    setTimeout(saberSequence, PLAY_MS);
  }, 200);
  setInterval(() => post(false), 2000);
}
H.onload = go; Gf.onload = go;
</script>
</body></html>
