<!doctype html>
<html><head><meta charset="utf-8"><title>unit</title></head>
<body>
<!-- Юнит-тест механики: ?test=имя (файл tools/tests/имя.js). Тест пишет в window.__result массив проверок. -->
<iframe id="f" style="width:1000px;height:640px;border:0"></iframe>
<pre id="out">WAIT</pre>
<script>
const name = new URLSearchParams(location.search).get('test');
const f = document.getElementById('f');
const out = document.getElementById('out');
f.src = new URL('../index.html', location.href).href;
f.onload = () => {
  try {
    const w = f.contentWindow, s = w.document.createElement('script');
    s.src = new URL('tests/' + name + '.js', location.href).href;
    s.onload = () => { out.textContent = 'RESULT ' + JSON.stringify(w.__result); };
    s.onerror = () => { out.textContent = 'RESULT ' + JSON.stringify([{ name: 'load ' + name, ok: false, got: 'script not found' }]); };
    w.document.body.appendChild(s);
  } catch (e) {
    out.textContent = 'RESULT ' + JSON.stringify([{ name: 'harness', ok: false, got: String(e) }]);
  }
};
</script>
</body></html>
