<!doctype html>
<html><head><meta charset="utf-8"><title>bot</title></head>
<body>
<!-- Бот играет в одиночную игру. Параметры: ?cls=jedi|smuggler&t=мс_до_отчёта -->
<iframe id="f" style="width:1000px;height:640px;border:0"></iframe>
<pre id="out">WAIT</pre>
<script>
const q = new URLSearchParams(location.search);
const f = document.getElementById('f');
f.src = new URL('../index.html?autotest=' + (q.get('cls') || 'jedi'), location.href).href;
f.onload = () => {
  const w = f.contentWindow, s = w.document.createElement('script');
  s.src = new URL('bot.js', location.href).href;
  w.document.body.appendChild(s);
};
setTimeout(() => {
  try { document.getElementById('out').textContent = 'RESULT ' + f.contentWindow.report(); }
  catch (e) { document.getElementById('out').textContent = 'RESULT ' + JSON.stringify({ errors: ['harness: ' + e] }); }
}, +(q.get('t') || 40000));
</script>
</body></html>
